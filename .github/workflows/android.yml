name: Android
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build test lint assembleAndroidTest :core:guard:koverVerify :core:guard:koverXmlReport
      - uses: actions/upload-artifact@v4
        with:
          name: probes-apk
          path: probes/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM in the ephemeral CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          script: ./gradlew :probes:connectedDebugAndroidTest
      - name: Verify instrumented tests actually executed
        run: python3 scripts/check-emulator-results.py
      - name: Print failed instrumented tests
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path("probes/build/outputs/androidTest-results/connected").rglob("*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          print(f"::group::{case.get('classname')}.{case.get('name')} ({tag})")
                          print((node.text or node.get("message") or "")[:6000])
                          print("::endgroup::")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-emulator-results
          path: |
            probes/build/reports/androidTests/connected/
            probes/build/outputs/androidTest-results/connected/
