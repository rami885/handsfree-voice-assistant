name: Backend
on:
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-safety.py
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-proxy/.node-version
          cache: npm
          cache-dependency-path: backend-proxy/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
